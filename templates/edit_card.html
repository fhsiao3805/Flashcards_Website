{% extends "base.html" %}
{% block title %}Edit card{% endblock %}
{% block content %}
<p><a href="{{ url_for('deck_detail', deck_id=card.deck_id) }}">← Back to {{ card.deck.name }}</a></p>
<h1>Edit card</h1>
<form method="post" class="panel stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="two-col">
    <label>Front
      <textarea name="front" rows="4" maxlength="2000" required>{{ front }}</textarea>
    </label>
    <label>Back
      <textarea name="back" rows="4" maxlength="2000" required>{{ back }}</textarea>
    </label>
  </div>
  <div class="row">
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="btn" href="{{ url_for('deck_detail', deck_id=card.deck_id) }}">Cancel</a>
  </div>
</form>
{% endblock %}
