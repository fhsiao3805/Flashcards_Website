{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="auth">
  <h1>Create an account</h1>
  <form method="post" class="panel stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input name="username" value="{{ username or '' }}" autocomplete="username"
             pattern="[A-Za-z0-9_]{3,30}" title="3-30 letters, numbers, or underscores" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" minlength="8" autocomplete="new-password" required>
    </label>
    <label>Confirm password
      <input name="confirm" type="password" minlength="8" autocomplete="new-password" required>
    </label>
    <button type="submit" class="btn btn-primary">Sign up</button>
  </form>
  <p class="center">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
