{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth">
  <h1>Welcome back</h1>
  <p class="muted">Log in to study your flashcards.</p>
  <form method="post" class="panel stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <label class="checkbox"><input type="checkbox" name="remember" value="1"> Keep me logged in</label>
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <p class="center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
