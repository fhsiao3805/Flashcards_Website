<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Flashcards{% endblock %} · Flashcards</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('decks') if current_user.is_authenticated else url_for('login') }}">🗂️ Flashcards</a>
    {% if current_user.is_authenticated %}
      <nav>
        <a href="{{ url_for('decks') }}">My decks</a>
        <span class="muted">{{ current_user.username }}</span>
        <form method="post" action="{{ url_for('logout') }}" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="link-button">Log out</button>
        </form>
      </nav>
    {% endif %}
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
